[platformio]
src_dir = firmware/ActuatorFirmware

[env:esp32-riscv-firmware-build]
platform = espressif32@7.0.1
# PlatformIO's XIAO ESP32-C6 board metadata does not currently enable Arduino.
# Compile the shared Arduino source for the supported XIAO ESP32-C3 RISC-V target;
# the C6 remains a manual, evidence-producing HIL target.
board = seeed_xiao_esp32c3
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@7.1.0
    teemuatlut/TMCStepper@0.7.3
build_flags =
    -D ACTUATOR_FIRMWARE_BUILD=1
